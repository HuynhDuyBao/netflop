<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflop</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#071014;color:#eef7f4;font-family:Arial,sans-serif">
        <div style="padding:24px;border:1px solid rgba(255,255,255,.16);border-radius:8px">
          Đang tải Netflop...
        </div>
      </main>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<main style="min-height:100vh;display:grid;place-items:center;background:#071014;color:#eef7f4;font-family:Arial,sans-serif">' +
          '<div style="max-width:720px;padding:24px;border:1px solid rgba(255,255,255,.16);border-radius:8px">' +
          '<h1 style="margin-top:0">Netflop không tải được JavaScript</h1>' +
          '<p style="color:#ffb7b7">' + (event.message || "Unknown error") + "</p>" +
          '<p>Hãy thử Ctrl+F5 hoặc mở port 5174.</p>' +
          "</div></main>";
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
